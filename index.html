<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小镇观察模拟器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-weather" aria-hidden="true">
      <div class="page-clouds page-clouds-back"></div>
      <div class="page-clouds page-clouds-front"></div>
      <div class="page-rain"></div>
    </div>
    <main class="shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Town Observation Simulator</p>
          <h1>小镇观察模拟器</h1>
          <p class="summary">
            开店经营一条小街，观察人流、天气、时段与节庆如何改变小镇的日常节律。
          </p>
          <p class="story-hook">
            盯着门口和路口多看一会儿：谁会冒雨改走捷径，哪家店把学生和游客都吸了过去，热门店门口怎么排起队来。
          </p>
        </div>
        <div class="hero-controls">
          <div class="actions">
            <button id="start-btn" type="button">开始经营</button>
            <button id="restart-btn" type="button">重新开档</button>
          </div>
          <div class="speed-controls" aria-label="时间流速">
            <span class="speed-label">观察节奏</span>
            <div class="speed-buttons">
              <button class="speed-button" data-speed="relaxed" type="button">舒缓</button>
              <button class="speed-button" data-speed="standard" type="button">标准</button>
              <button class="speed-button" data-speed="busy" type="button">热闹</button>
            </div>
          </div>
          <div class="guide">
            <p class="guide-title">操作要点</p>
            <p class="hint">
              <b>左键</b> 放置设施 · <b>右键</b> 拆除 · <b>0</b> 观察模式 · <b>1-5</b> 快捷选店 · <b>-/+</b> 节奏 · <b>F</b> 全屏 · <b>R</b> 重开
            </p>
          </div>
          <div class="future-slot">
            <p class="future-copy">阶段目标完成后小镇继续运行，结局与长期观察内容将在这里解锁。</p>
          </div>
        </div>
      </section>
      <section class="stage">
        <canvas id="game" width="1420" height="920" aria-label="小镇观察模拟器 canvas"></canvas>
      </section>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
